# Redacted example — copy to config.yaml and fill in secrets via:
#   rssify config set backends.firecrawl.api_key <key>   (FIRECRAWL_API_KEY in .env)
server:
  # Docker: must be 0.0.0.0 (127.0.0.1 binds only inside the container).
  host: 0.0.0.0
  port: 3000
  # Optional: external base URL for feed self-links (e.g. behind Traefik with
  # TLS). If unset, feeds use the Host header of the incoming request.
  # public_url: https://rssify.example.com
backends:
  camofox:
    base_url: http://127.0.0.1:9377
    access_key: ""
    user_id: rssify
    request_timeout_ms: 60000
  firecrawl:
    mode: cloud
    base_url: https://api.firecrawl.dev
    api_key: ${FIRECRAWL_API_KEY}
    request_timeout_ms: 60000
defaults:
  schedule: 0 */6 * * *
  engine: camofox
  # Fetch-cascade engine priority for article pages: plain fetch is tried
  # first; on fetch failure, a bot gate, or a junk/near-empty cleaned body
  # (empty, too short, or gate/error/consent/offer/footer junk per
  # src/quality.ts) the next engine in the list advances. Firecrawl is skipped
  # entirely while no API key is configured. `engine` (above) still drives
  # feed discovery and is the single-engine fallback when this list is empty
  # or invalid. Set this to an empty list ([]) to restore exact single-engine
  # behavior. Per-site override in the site's config_json:
  # {"extract": {"enginePriority": ["plain", "camofox"]}}.
  engine_priority: [plain, camofox, firecrawl]
  schedule_jitter_seconds: 1800
  # Maximum articles shown per feed on the main HTML index; also the default
  # page size for /feed/<site>/articles. RSS output remains controlled
  # separately by feed_item_limit.
  website_item_limit: 10
  feed_item_limit: 10
  scrape_concurrency: 2
  scrape_delay:
    lower_sec: 2
    upper_sec: 5
  discover_max: 100
  follow: true
  follow_depth: 3
  follow_until_404: false
  wait_ms: 0
  ignore_images: false
  store_raw: true
  # Source-URL blacklist: candidates whose URL (or canonical URL after a
  # redirect) matches a host pattern are skipped before any fetch and never
  # persisted. YouTube is excluded from ingestion by default (host patterns
  # cover every subdomain; add a path prefix like "youtube.com/shorts" to
  # narrow a match). Per-site override: config_json
  # {"extract": {"urlBlacklist": []}} — an empty array disables it there.
  url_blacklist: [youtube.com, youtu.be]
  # Narrow non-article URL-pattern filter (wildcards, matched against
  # <host><pathname>) — for quote/chart/report-landing destinations without
  # banning whole hosts. Empty by default. Per-site override:
  # {"extract": {"skipUrlPatterns": ["cnbc.com/quote/*"]}}.
  skip_url_patterns: []
  # Recurring boilerplate blocks trimmed from cleaned articles (consent
  # banners, "Preferred Sources" widgets, "Advt" labels, app promos, © footer
  # plates, related-content tails). Only SHORT blocks (< 600 chars, < half
  # the document text) matching a marker are removed. Per-site override:
  # config_json extract.boilerplateMarkers (empty array disables).
  boilerplate_markers:
    - add to google preferred sources
    - appears first in google search top stories
    - we use cookies
    - i agree to the updated privacy policy
    - manage cookie preferences
    - manage preferences
    - advt
    - download our app
    - get the app
    - install our app
    - you may also like
    - all rights reserved
storage:
  data_dir: ./data
  db_path: ./data/state.sqlite
  keep_content_forever: true
